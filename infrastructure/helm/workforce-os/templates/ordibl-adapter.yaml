apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordibl-adapter
  labels:
    app: ordibl-adapter
    {{- include "workforce-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.ordiblAdapter.replicas }}
  selector:
    matchLabels:
      app: ordibl-adapter
  template:
    metadata:
      labels:
        app: ordibl-adapter
    spec:
      containers:
        - name: ordibl-adapter
          image: {{ include "workforce-os.image" (dict "Values" .Values "svc" "ordibl-adapter") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.ordiblAdapter.port }}
          env:
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.ordiblAdapter.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.ordiblAdapter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ordibl-adapter
spec:
  selector:
    app: ordibl-adapter
  ports:
    - port: {{ .Values.services.ordiblAdapter.port }}
      targetPort: {{ .Values.services.ordiblAdapter.port }}
