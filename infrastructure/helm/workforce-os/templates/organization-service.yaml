apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-service
  labels:
    app: organization-service
    {{- include "workforce-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.organizationService.replicas }}
  selector:
    matchLabels:
      app: organization-service
  template:
    metadata:
      labels:
        app: organization-service
    spec:
      containers:
        - name: organization-service
          image: {{ include "workforce-os.image" (dict "Values" .Values "svc" "organization-service") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.organizationService.port }}
          env:
            - name: PYTHONPATH
              value: /app
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: dsn
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.organizationService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.organizationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: organization-service
spec:
  selector:
    app: organization-service
  ports:
    - port: {{ .Values.services.organizationService.port }}
      targetPort: {{ .Values.services.organizationService.port }}
