apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  labels:
    app: integration-service
    {{- include "workforce-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.integrationService.replicas }}
  selector:
    matchLabels:
      app: integration-service
  template:
    metadata:
      labels:
        app: integration-service
    spec:
      containers:
        - name: integration-service
          image: {{ include "workforce-os.image" (dict "Values" .Values "svc" "integration-service") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.integrationService.port }}
          env:
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.integrationService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.integrationService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: integration-service
spec:
  selector:
    app: integration-service
  ports:
    - port: {{ .Values.services.integrationService.port }}
      targetPort: {{ .Values.services.integrationService.port }}
