apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app: agent-runtime
    {{- include "workforce-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.agentRuntime.replicas }}
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: {{ include "workforce-os.image" (dict "Values" .Values "svc" "agent-runtime") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.agentRuntime.port }}
          env:
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.agentRuntime.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.agentRuntime.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
spec:
  selector:
    app: agent-runtime
  ports:
    - port: {{ .Values.services.agentRuntime.port }}
      targetPort: {{ .Values.services.agentRuntime.port }}
