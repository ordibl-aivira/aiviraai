apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine
  labels:
    app: workflow-engine
    {{- include "workforce-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.workflowEngine.replicas }}
  selector:
    matchLabels:
      app: workflow-engine
  template:
    metadata:
      labels:
        app: workflow-engine
    spec:
      containers:
        - name: workflow-engine
          image: {{ include "workforce-os.image" (dict "Values" .Values "svc" "workflow-engine") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.workflowEngine.port }}
          env:
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.workflowEngine.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.workflowEngine.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-engine
spec:
  selector:
    app: workflow-engine
  ports:
    - port: {{ .Values.services.workflowEngine.port }}
      targetPort: {{ .Values.services.workflowEngine.port }}
