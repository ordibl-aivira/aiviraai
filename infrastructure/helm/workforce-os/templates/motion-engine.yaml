apiVersion: apps/v1
kind: Deployment
metadata:
  name: motion-engine
  labels:
    app: motion-engine
    layer: decision
    {{- include "workforce-os.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.motionEngine.replicas }}
  selector:
    matchLabels:
      app: motion-engine
  template:
    metadata:
      labels:
        app: motion-engine
        layer: decision
    spec:
      containers:
        - name: motion-engine
          image: {{ include "workforce-os.image" (dict "Values" .Values "svc" "motion-engine") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.motionEngine.port }}
          env:
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.motionEngine.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.motionEngine.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: motion-engine
spec:
  selector:
    app: motion-engine
  ports:
    - port: {{ .Values.services.motionEngine.port }}
      targetPort: {{ .Values.services.motionEngine.port }}
