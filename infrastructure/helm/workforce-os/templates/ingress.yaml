{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workforce-os-ingress
  labels:
    {{- include "workforce-os.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ .Values.services.apiGateway.port }}
          - path: {{ .Values.ingress.webhookPath | default "/webhooks" }}
            pathType: Prefix
            backend:
              service:
                name: ordibl-adapter
                port:
                  number: {{ .Values.services.ordiblAdapter.port }}
{{- end }}
