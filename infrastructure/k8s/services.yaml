# ────────────────────────────────────────────────────────────────
# Workforce OS — Application Service Deployments
# ────────────────────────────────────────────────────────────────
# Each service follows the same pattern:
#   Deployment (1+ replicas) + ClusterIP Service
#
# Container images are referenced as ${REGISTRY}/workforce-os/<svc>:${TAG}
# Override with kustomize overlays or Helm values.
# ────────────────────────────────────────────────────────────────

# ── API Gateway ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: workforce-os
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: workforce-os/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: workforce-os
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000

