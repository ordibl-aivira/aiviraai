# ── Memory Service ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: workforce-os
  labels:
    app: memory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
        - name: memory-service
          image: workforce-os/memory-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: PYTHONPATH
              value: /app
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: dsn
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: QDRANT_URL
              value: http://qdrant:6333
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
