version: "3.9"

# ────────────────────────────────────────────────────────────────
# Aivira Workforce OS — Local Development Stack
# ────────────────────────────────────────────────────────────────
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.yaml up --build
#
# All services share PYTHONPATH=/app so that `packages.shared.*`
# imports resolve correctly inside every container.
# ────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  networks:
    - workforce

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordibl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *common
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.3
    <<: *common
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # ── Workforce OS Services ──────────────────────────────────
  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api_gateway/Dockerfile
    <<: *common
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      AGENT_RUNTIME_PORT: "8001"
      WORKFLOW_ENGINE_PORT: "8003"
      MEMORY_SERVICE_PORT: "8004"
      ORGANIZATION_SERVICE_PORT: "8007"
    depends_on:
      - agent-runtime
      - workflow-engine
      - memory-service
      - organization-service

  agent-runtime:
    build:
      context: ../../
      dockerfile: apps/agent_runtime/Dockerfile
    <<: *common
    ports:
      - "8001:8001"
    environment:
      PYTHONPATH: /app
      MEMORY_SERVICE_PORT: "8004"
      INTEGRATION_SERVICE_PORT: "8005"

  ordibl-adapter:
    build:
      context: ../../
      dockerfile: apps/ordibl_adapter/Dockerfile
    <<: *common
    ports:
      - "8002:8002"
    environment:
      PYTHONPATH: /app
      AGENT_RUNTIME_PORT: "8001"
    depends_on:
      - agent-runtime

  workflow-engine:
    build:
      context: ../../
      dockerfile: apps/workflow_engine/Dockerfile
    <<: *common
    ports:
      - "8003:8003"
    environment:
      PYTHONPATH: /app
      AGENT_RUNTIME_PORT: "8001"
    depends_on:
      - agent-runtime

  memory-service:
    build:
      context: ../../
      dockerfile: apps/memory_service/Dockerfile
    <<: *common
    ports:
      - "8004:8004"
    environment:
      PYTHONPATH: /app
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ordibl
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  integration-service:
    build:
      context: ../../
      dockerfile: apps/integration_service/Dockerfile
    <<: *common
    ports:
      - "8005:8005"
    environment:
      PYTHONPATH: /app

  auth-service:
    build:
      context: ../../
      dockerfile: apps/auth_service/Dockerfile
    <<: *common
    ports:
      - "8006:8006"
    environment:
      PYTHONPATH: /app
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ordibl
    depends_on:
      postgres:
        condition: service_healthy

  organization-service:
    build:
      context: ../../
      dockerfile: apps/organization_service/Dockerfile
    <<: *common
    ports:
      - "8007:8007"
    environment:
      PYTHONPATH: /app
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ordibl
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: ../../
      dockerfile: apps/analytics_service/Dockerfile
    <<: *common
    ports:
      - "8008:8008"
    environment:
      PYTHONPATH: /app

  notification-service:
    build:
      context: ../../
      dockerfile: apps/notification_service/Dockerfile
    <<: *common
    ports:
      - "8009:8009"
    environment:
      PYTHONPATH: /app

  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    <<: *common
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:

networks:
  workforce:
    driver: bridge
