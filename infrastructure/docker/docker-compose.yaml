version: "3.9"

# ────────────────────────────────────────────────────────────────
# Aivira Workforce OS — Local Development Stack
# ────────────────────────────────────────────────────────────────
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.yaml up --build
#
# All services share PYTHONPATH=/app so that `packages.shared.*`
# imports resolve correctly inside every container.
# ────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  networks:
    - workforce

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordibl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *common
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.3
    <<: *common
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # ── Event Bus ─────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    <<: *common
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--js", "--sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 5

  # ── Observability ────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    <<: *common
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    command: ["--config=/etc/otel-collector-config.yaml"]

  # ── Workforce OS Services ──────────────────────────────────
  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api_gateway/Dockerfile
    <<: *common
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      AGENT_RUNTIME_PORT: "8001"
      WORKFLOW_ENGINE_PORT: "8003"
      MEMORY_SERVICE_PORT: "8004"
      ORGANIZATION_SERVICE_PORT: "8007"
    depends_on:
      - agent-runtime
      - workflow-engine
      - memory-service
      - organization-service

  agent-runtime:
    build:
      context: ../../
      dockerfile: apps/agent_runtime/Dockerfile
    <<: *common
    ports:
      - "8001:8001"
    environment:
      PYTHONPATH: /app
      MEMORY_SERVICE_PORT: "8004"
      INTEGRATION_SERVICE_PORT: "8005"

  ordibl-adapter:
    build:
      context: ../../
      dockerfile: apps/ordibl_adapter/Dockerfile
    <<: *common
    ports:
      - "8002:8002"
    environment:
      PYTHONPATH: /app
      AGENT_RUNTIME_PORT: "8001"
    depends_on:
      - agent-runtime

  workflow-engine:
    build:
      context: ../../
      dockerfile: apps/workflow_engine/Dockerfile
    <<: *common
    ports:
      - "8003:8003"
    environment:
      PYTHONPATH: /app
      AGENT_RUNTIME_PORT: "8001"
    depends_on:
      - agent-runtime

  memory-service:
    build:
      context: ../../
      dockerfile: apps/memory_service/Dockerfile
    <<: *common
    ports:
      - "8004:8004"
    environment:
      PYTHONPATH: /app
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ordibl
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  integration-service:
    build:
      context: ../../
      dockerfile: apps/integration_service/Dockerfile
    <<: *common
    ports:
      - "8005:8005"
    environment:
      PYTHONPATH: /app

  auth-service:
    build:
      context: ../../
      dockerfile: apps/auth_service/Dockerfile
    <<: *common
    ports:
      - "8006:8006"
    environment:
      PYTHONPATH: /app
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ordibl
    depends_on:
      postgres:
        condition: service_healthy

  organization-service:
    build:
      context: ../../
      dockerfile: apps/organization_service/Dockerfile
    <<: *common
    ports:
      - "8007:8007"
    environment:
      PYTHONPATH: /app
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/ordibl
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: ../../
      dockerfile: apps/analytics_service/Dockerfile
    <<: *common
    ports:
      - "8008:8008"
    environment:
      PYTHONPATH: /app

  notification-service:
    build:
      context: ../../
      dockerfile: apps/notification_service/Dockerfile
    <<: *common
    ports:
      - "8009:8009"
    environment:
      PYTHONPATH: /app

  # ── Cognitive → Execution Stack ───────────────────────────────
  research-agent:
    build:
      context: ../../
      dockerfile: apps/research_agent/Dockerfile
    <<: *common
    ports:
      - "8010:8010"
    environment:
      PYTHONPATH: /app
      INTEGRATION_SERVICE_URL: http://integration-service:8005
      MEMORY_SERVICE_URL: http://memory-service:8004
    depends_on:
      - integration-service
      - memory-service

  content-agent:
    build:
      context: ../../
      dockerfile: apps/content_agent/Dockerfile
    <<: *common
    ports:
      - "8011:8011"
    environment:
      PYTHONPATH: /app

  motion-engine:
    build:
      context: ../../
      dockerfile: apps/motion_engine/Dockerfile
    <<: *common
    ports:
      - "8012:8012"
    environment:
      PYTHONPATH: /app

  execution-engine:
    build:
      context: ../../
      dockerfile: apps/execution_engine/Dockerfile
    <<: *common
    ports:
      - "8013:8013"
    environment:
      PYTHONPATH: /app
      RESEARCH_AGENT_URL: http://research-agent:8010
      CONTENT_AGENT_URL: http://content-agent:8011
      MOTION_ENGINE_URL: http://motion-engine:8012
      NOTIFICATION_SERVICE_URL: http://notification-service:8009
      ORDIBL_ADAPTER_URL: http://ordibl-adapter:8002
      INTEGRATION_SERVICE_URL: http://integration-service:8005
      MEMORY_SERVICE_URL: http://memory-service:8004
    depends_on:
      - research-agent
      - content-agent
      - motion-engine
      - notification-service
      - ordibl-adapter
      - integration-service
      - memory-service

  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    <<: *common
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
  natsdata:

networks:
  workforce:
    driver: bridge
